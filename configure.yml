---
# Configuration pass for the plexus operations platform — ingress
# routes, secrets, app directories, .env, container re-creation.
# Safe to re-run often; assumes provision.yml has already run on the host.
# Not a deploy: deploying is the verb's act (PLX-Deploy); this playbook binds
# apps to the host and hands them their environment (PLX-Platform).
#
#   mise configure
#
- name: Configure the plexus operations platform
  hosts: plexus
  become: true
  roles:
    - plexus.platform.configure_ingress
    - plexus.platform.configure_secrets # before the apps, so the first up sees the secrets
    - plexus.platform.configure_apps
