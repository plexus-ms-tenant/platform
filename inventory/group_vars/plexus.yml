plexus_tenant: plexus

# Unprivileged user that owns app dirs and runs the deploy verb (via CI SSH).
plexus_deploy_user: plexus
plexus_deploy_root: /opt/stacks

# Re-create containers during a configure-playbook run (rotation — § 7.2 PLX)
# and pull + start apps whose compose file the deploy verb has already placed.
# Safe to leave true: an app never deployed yet is skipped, not fatal.
plexus_up: true

# Apps on this host — one record per app, the app's whole platform binding
# (§ 7.1 PLX). The app's run shape (compose.yaml) is NOT here: it lives in the
# app's source repo and the deploy verb renders it onto the host (§ 5.2 PLX).
# App names are unique per tenant across every repo.
#
#   - name: my-app                          # unique per tenant
#     repo: plexus-ms-tenant/web            # source repo (informative — where the app's code lives)
#     host: my-app.example.org              # ingress: the public host, TLS + route → loopback port
#     loopback_port: 3000                   # 127.0.0.1 port the app publishes, unique per VM
#     env:                                  # non-secret values → .env
#       PUBLIC_URL: https://my-app.example.org
#     secrets:                              # op:// pointers → .env.secret (0600), resolved from the vault
#       DATABASE_URL: op://plexus/my-app-db/url
#
#   - name: uptime                          # a third-party app: source repo is THIS repo, apps/uptime/
#     repo: plexus-ms-tenant/platform
#     host: ops.example.org
#     path: /uptime                         # optional: served under ops.example.org/uptime/, prefix stripped;
#                                           # apps sharing a host differ by path, at most one serves its root
#     loopback_port: 3001
#     healthz: /api/status-page/heartbeat   # mirrors the app's plexus.healthz label, so the proxy fences it (§ 5.5 PLX)
plexus_apps:
  - name: website
    repo: plexus-ms-tenant/web
    host: plexus-ms.org
    loopback_port: 3000
    secrets:
      REVALIDATE_TOKEN: op://plexus/website-revalidate/credential

# Base packages the host needs
plexus_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - python3-debian # required by deb822_repository module
  - sudo
  - ufw
  - fail2ban
  - unattended-upgrades
  - acl

# Secrets
plexus_deploy_pubkey: "{{ lookup('env', 'DEPLOY_PUBKEY') | default('', true) }}"
plexus_operator_pubkey: "{{ lookup('env', 'OPERATOR_PUBKEY') | default('', true) }}"
plexus_ghcr_user: "{{ lookup('env', 'GHCR_USER') | default('', true) }}"
plexus_ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"

# The host is reached over the overlay as the person running the playbook;
# the admin accounts come from the hypervisor's cloud-init.
ansible_become: true

# What sits in front of the host (host-level, § 7.1 PLX): the damage tenant's
# ingress VM routes by SNI and announces the real peer with the PROXY protocol;
# plexus-ms.org is Cloudflare-proxied, so the client address comes from
# CF-Connecting-IP when the peer is one of Cloudflare's ranges.
configure_ingress_proxy_protocol_from: [10.10.0.0/24]
configure_ingress_trusted_proxies: cloudflare
