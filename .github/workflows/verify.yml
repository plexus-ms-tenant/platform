name: verify

# Mounts the verify verb (§ 2 PLX-Delivery): playbook syntax against the
# pinned collection, on every pull request and on every push to `main`, the
# trunk that takes an operator's direct pushes. A push to any other branch
# starts nothing until it has a pull request, and a change to nothing but
# Markdown starts nothing at all. Managed by copier: edit the preset
# (plexus-ms/preset-repo-platform), never this file.

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Where the jobs run: the CI_RUNNER repo variable is the runner label, unset
# for GitHub's runners.
jobs:
  verify:
    uses: plexus-ms/primitives/.github/workflows/_verify.yml@0.104.0
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

